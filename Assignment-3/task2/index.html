<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-container {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        }

        .signup-container h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 14px;
            color: #334155;
            margin-bottom: 6px;
            display: block;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .signup-btn:hover {
            background: #1e40af;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn {
            background: #1e40af;
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-top: 18px;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Create Account</h2>

        <form method="POST" action="/submit">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="signup-btn">
        Sign Up
    </button>

    <a href="/view">
        <button type="button" class="btn">
            View
        </button>
    </a>
            
        </form>

        <p class="footer-text">
        </p>
    </div>

</body>
</html>
